# Used for local runs. The Databricks dbt task injects its own profile from
# the job definition (catalog, schema, warehouse), so this file is not needed there.
lol_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DBT_CATALOG', 'lol_dev') }}"
      schema: silver
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
