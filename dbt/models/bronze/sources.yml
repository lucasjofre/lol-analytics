version: 2

sources:
  - name: bronze
    database: "{{ target.catalog }}"
    schema: bronze
    description: Raw Riot API payloads written by the crawler. One JSON string per row.
    tables:
      - name: matches
        columns:
          - name: match_id
            tests: [not_null, unique]
          - name: payload
            tests: [not_null]
      - name: timelines
        columns:
          - name: match_id
            tests: [not_null, unique]
          - name: status
            tests:
              - accepted_values:
                  values: [ok, not_found]
      - name: league_entries
      - name: targets
      - name: crawl_runs
