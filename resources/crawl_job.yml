resources:
  jobs:
    crawl:
      name: "[${bundle.target}] lol_analytics crawl"
      description: >
        Daily Riot API crawl: refresh cohort membership, fetch new match details
        and timelines into bronze, then run dbt. Tasks are sequential on purpose:
        the Riot rate limit is per key per host, so only one process may call
        the API at a time.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: crawler
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
        - environment_key: dbt
          spec:
            client: "2"
            dependencies:
              - dbt-databricks>=1.9

      parameters:
        - name: config
          default: ${workspace.file_path}/config/crawl.${bundle.target}.yml
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: refresh_cohort
          environment_key: crawler
          python_wheel_task:
            package_name: lol_analytics
            entry_point: refresh_cohort
            parameters:
              - "--config"
              - "{{job.parameters.config}}"
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--secret-scope"
              - ${var.secret_scope}

        - task_key: crawl
          depends_on:
            - task_key: refresh_cohort
          environment_key: crawler
          python_wheel_task:
            package_name: lol_analytics
            entry_point: crawl
            parameters:
              - "--config"
              - "{{job.parameters.config}}"
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--secret-scope"
              - ${var.secret_scope}

        - task_key: dbt
          depends_on:
            - task_key: crawl
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            catalog: ${var.catalog}
            schema: silver
            warehouse_id: ${var.warehouse_id}
            commands:
              - dbt deps
              - dbt build
