resources:
  jobs:
    ladder:
      name: "[${bundle.target}] lol ladder snapshot"

      # ~1.2M accounts at ~205 per call is ~5.9k calls, well under 30 min.
      # Weekly is enough: this is who sits where, not what they played.
      schedule:
        quartz_cron_expression: "0 0 4 ? * SUN"
        timezone_id: America/Sao_Paulo
        pause_status: ${var.schedule_status}

      tasks:
        - task_key: ladder
          python_wheel_task:
            package_name: lol_analytics
            entry_point: lol-ladder
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl

      queue:
        enabled: true
