[project]
name = "lol-analytics"
version = "0.1.0"
description = "League of Legends analytics on Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "databricks-connect>=16.1.7",
]
