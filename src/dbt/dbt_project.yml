name: lol_analytics
version: 0.1.0
config-version: 2

profile: lol_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  lol_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  lol_analytics:
    +schema: staging

snapshots:
  lol_analytics:
    +schema: staging
