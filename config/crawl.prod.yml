# Prod target: complete daily capture of a rank cohort plus personal accounts.
# Budget on a personal key is ~36k matches/day per regional host; NA and BR
# share the americas host. Diamond+ on one platform is ~7-10k matches/day.
name: prod

personal:
  - name: me
    platform: br1
    game_name: CHANGE_ME
    tag_line: BR1
    max_games: 200

cohorts:
  - name: br_diamond_plus
    platform: br1
    queue: RANKED_SOLO_5x5
    tiers: [CHALLENGER, GRANDMASTER, MASTER, DIAMOND]
    divisions: [I, II, III, IV]
    max_games_per_account: 20   # per run; the anti-join keeps only unseen ids

queue_id: 420
since_days: 365
time_budget_minutes: 480
batch_size: 200
fetch_timelines: true
