# Declarative Automation Bundle root.
# The presence of this file at the repo root is what makes this a bundle;
# `databricks bundle <cmd>` walks up from the cwd looking for it.
bundle:
  name: lol_analytics

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9f02ee48-8e67.cloud.databricks.com
      profile: lol
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-9f02ee48-8e67.cloud.databricks.com
      profile: lol
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
