# Databricks Asset Bundle root.
# The presence of this file at the repo root is what makes this a bundle;
# `databricks bundle <cmd>` walks up from the cwd looking for it.
bundle:
  name: lol_analytics

include:
  - resources/*.yml

artifacts:
  lol_analytics:
    type: whl
    path: .
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog holding bronze/silver/gold schemas
    default: lol_dev
  secret_scope:
    description: Secret scope containing riot_api_key
    default: lol
  warehouse_id:
    description: SQL warehouse used by the dbt task
    default: ""
  schedule_pause_status:
    description: PAUSED or UNPAUSED
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      # host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      # host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lol
      schedule_pause_status: UNPAUSED
